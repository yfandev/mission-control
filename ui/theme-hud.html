  <!-- THEME:HUD START ======================================================
       Drone-command HUD theme: smoky graphite glass over a dark 3D city grid,
       one orange accent, soft green for healthy status. Layered on top of the
       original styles; open with ?theme=neon for the original look.
       ====================================================================== -->
  <script>
    if (!/[?&]theme=neon/.test(location.search)) document.documentElement.classList.add('hud');
    // High-contrast mode for projectors: ?contrast=high, or press H to toggle (remembered per browser).
    (function () {
      const root = document.documentElement;
      let saved = null;
      try { saved = localStorage.getItem('mc-contrast'); } catch (e) {}
      const param = (location.search.match(/[?&]contrast=(high|normal)/) || [])[1];
      if ((param || saved) === 'high') root.classList.add('hc');
      addEventListener('keydown', function (e) {
        if (e.key !== 'h' && e.key !== 'H') return;
        if (e.metaKey || e.ctrlKey || e.altKey || /input|textarea/i.test(e.target.tagName)) return;
        const on = root.classList.toggle('hc');
        try { localStorage.setItem('mc-contrast', on ? 'high' : 'normal'); } catch (err) {}
      });
    })();
  </script>
  <style id="theme-hud">
    html.hud {
      --bg-space: #0d0e10;
      --bg-panel: rgba(44, 46, 50, 0.62);
      --bg-panel-solid: rgba(38, 40, 44, 0.9);
      --border-panel: rgba(255, 255, 255, 0.08);
      --border-panel-bright: rgba(255, 255, 255, 0.18);
      --color-cyan: #c9d4de;          /* events: cool light grey */
      --color-cyan-glow: rgba(201, 212, 222, 0.35);
      --color-green: #7ddc6f;         /* healthy / actions */
      --color-green-glow: rgba(125, 220, 111, 0.35);
      --color-amber: #ff7a2f;         /* the orange accent / handoffs */
      --color-amber-glow: rgba(255, 122, 47, 0.45);
      --color-red: #ff4a3d;
      --color-red-glow: rgba(255, 74, 61, 0.55);
      --color-purple: #ff9a5c;
      --color-text-bright: #ffffff;
      --color-text-main: rgba(255, 255, 255, 0.86);
      --color-text-dim: rgba(255, 255, 255, 0.5);
      --color-text-dark: rgba(255, 255, 255, 0.32);
      --orange: #ff7a2f;
      --panel: rgba(46, 48, 52, 0.58);
      --row: rgba(255, 255, 255, 0.045);
      --edge: rgba(255, 255, 255, 0.09);
      --shine: inset 0 1px 0 rgba(255, 255, 255, 0.09);
      --shadow: 0 30px 70px rgba(0, 0, 0, 0.55);
      --r-panel: 20px;
      --r-row: 12px;
      --font-sans: -apple-system, "SF Pro Text", "Inter", "Segoe UI", Roboto, sans-serif;
      --font-mono: "SF Mono", ui-monospace, Menlo, monospace;
    }

    /* Background: a dark city seen from above. A tilted grid fades into fog,
       with a few orange HUD ticks. */
    html.hud body {
      background:
        radial-gradient(80% 60% at 50% 120%, rgba(255, 122, 47, 0.07), transparent 60%),
        radial-gradient(120% 80% at 50% -20%, #23262b 0%, #121316 55%, #0b0c0e 100%);
      font-size: 14px;
    }
    html.hud body::before {
      background-image:
        linear-gradient(rgba(255, 255, 255, 0.06) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.06) 1px, transparent 1px),
        linear-gradient(rgba(255, 255, 255, 0.025) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.025) 1px, transparent 1px);
      background-size: 120px 120px, 120px 120px, 24px 24px, 24px 24px;
      transform: perspective(900px) rotateX(58deg) scale(2.2) translateY(8%);
      transform-origin: 50% 100%;
      mask-image: linear-gradient(to top, rgba(0, 0, 0, 0.9), transparent 75%);
      -webkit-mask-image: linear-gradient(to top, rgba(0, 0, 0, 0.9), transparent 75%);
    }
    html.hud body::after { background: radial-gradient(circle at 50% 45%, transparent 50%, rgba(5, 6, 8, 0.75) 100%); }

    /* Smoky graphite panels */
    html.hud #header-bar,
    html.hud .stat-card,
    html.hud #graph-panel,
    html.hud #sidebar-panel,
    html.hud #bottom-bar {
      background: var(--panel);
      border: 1px solid var(--edge);
      border-radius: var(--r-panel);
      box-shadow: var(--shine), var(--shadow);
      backdrop-filter: blur(22px) saturate(120%);
      -webkit-backdrop-filter: blur(22px) saturate(120%);
    }
    html.hud .stat-card { overflow: hidden; position: relative; }
    html.hud .stat-card::before { display: none; }
    html.hud #footer-strip { background: transparent; border: 0; color: var(--color-text-dark); }

    /* Labels: small uppercase grey with icon. Values: white, right-weighted. */
    html.hud .brand-title { font-family: var(--font-sans); font-weight: 700; letter-spacing: 0.02em; }
    html.hud .brand-title .accent { color: var(--orange); text-shadow: none; }
    html.hud .brand-icon { border-radius: 12px; background: rgba(255, 122, 47, 0.12); border: 1px solid rgba(255, 122, 47, 0.45); color: var(--orange); box-shadow: none; }
    html.hud .stat-label { font-family: var(--font-sans); font-size: 11px; font-weight: 600; letter-spacing: 0.08em; color: var(--color-text-dim); }
    html.hud .stat-value { font-family: var(--font-sans); font-weight: 600; font-size: 34px; letter-spacing: -0.02em; color: #fff; text-shadow: none; }
    html.hud .stat-footer { font-family: var(--font-sans); color: var(--color-text-dark); letter-spacing: 0.02em; }
    html.hud .stat-card.color-cyan .stat-label,
    html.hud .stat-card.color-green .stat-label,
    html.hud .stat-card.color-amber .stat-label,
    html.hud .stat-card.color-purple .stat-label { color: var(--color-text-dim); }
    html.hud .stat-card .stat-label svg { color: var(--orange); }
    html.hud .stat-card.color-red.active-alert {
      background: linear-gradient(160deg, rgba(255, 74, 61, 0.42), rgba(60, 14, 12, 0.7));
      border-color: rgba(255, 110, 95, 0.6);
      box-shadow: var(--shine), 0 0 46px rgba(255, 74, 61, 0.45);
    }

    /* Status pills: orange outline tag like "ON PATROL" */
    html.hud .offline-badge {
      border-radius: 8px; background: rgba(255, 122, 47, 0.1); border: 1px solid rgba(255, 122, 47, 0.55);
      color: var(--orange); font-family: var(--font-sans); font-weight: 700; letter-spacing: 0.06em;
    }
    html.hud .offline-badge .pulsing-dot { background: var(--orange); box-shadow: 0 0 10px var(--orange); }
    html.hud #mock-badge { border-radius: 8px; background: rgba(255, 74, 61, 0.15); border: 1px solid rgba(255, 74, 61, 0.6); color: #ff8a80; font-family: var(--font-sans); }
    html.hud .clock-display,
    html.hud .log-counter,
    html.hud .panel-header-corner .tag {
      border-radius: 8px; background: var(--row); border: 1px solid var(--edge); font-family: var(--font-mono); color: #fff;
    }

    /* Graph: graphite cards, orange highlights, HUD-style thin wires */
    html.hud .node-bg { fill: rgba(52, 54, 58, 0.78); stroke: rgba(255, 255, 255, 0.1); rx: 16px; filter: drop-shadow(0 18px 26px rgba(0, 0, 0, 0.55)); }
    html.hud .node-header-bg { fill: rgba(255, 255, 255, 0.04); rx: 16px; }
    html.hud .node-title { font-family: var(--font-sans); font-weight: 700; letter-spacing: 0.04em; fill: #fff; }
    html.hud .node-subtitle,
    html.hud .node-badge-text { font-family: var(--font-sans); fill: rgba(255, 255, 255, 0.55); }
    html.hud #nodes-layer g > rect:not(.node-bg):not(.node-header-bg) { rx: 10px; fill: rgba(255, 255, 255, 0.05); stroke: rgba(255, 255, 255, 0.08); }
    html.hud .node-status-circle { fill: var(--color-green); filter: drop-shadow(0 0 5px var(--color-green)); }
    html.hud .wire-path { stroke: rgba(255, 255, 255, 0.13); stroke-width: 1.2; }
    html.hud .wire-handoff { stroke: rgba(255, 122, 47, 0.28); }
    html.hud .node-box.highlight-event .node-bg { fill: rgba(80, 84, 90, 0.9); stroke: rgba(255, 255, 255, 0.55); }
    html.hud .node-box.highlight-action .node-bg { fill: rgba(56, 74, 52, 0.9); stroke: rgba(125, 220, 111, 0.8); }
    html.hud .node-box.highlight-handoff .node-bg { fill: rgba(90, 52, 30, 0.9); stroke: rgba(255, 122, 47, 0.95); }
    html.hud .node-box.highlight-blocked .node-bg { fill: rgba(110, 24, 20, 0.92); stroke: rgba(255, 90, 75, 1); }
    /* Recolor the animated pulses (the JS sets neon fills; CSS wins over SVG attributes) */
    html.hud .pulse-particle[fill="#00f0ff"] { fill: #e6edf3; }
    html.hud .pulse-particle[fill="#00ff88"] { fill: #7ddc6f; }
    html.hud .pulse-particle[fill="#ffb700"] { fill: #ff7a2f; }
    html.hud .pulse-particle[fill="#ff2a55"] { fill: #ff4a3d; }

    /* SVG labels: the page asks for "ui-monospace", which SVG can't resolve (falls back to serif) */
    html.hud #nodes-layer text { font-family: var(--font-mono); }
    html.hud #stream-events-count { fill: var(--orange); }
    #nodes-layer text[font-family="ui-monospace"] { font-family: "SF Mono", Menlo, Consolas, monospace; }

    /* Mission feed: row cards with a colored edge */
    html.hud .sidebar-title { font-family: var(--font-sans); font-weight: 700; letter-spacing: 0.08em; font-size: 11px; color: var(--color-text-dim); }
    html.hud .sidebar-title svg { stroke: var(--orange); }
    html.hud .filter-tabs { gap: 6px; }
    html.hud .filter-tab { border-radius: 8px; background: var(--row); border: 1px solid var(--edge); font-family: var(--font-sans); letter-spacing: 0.04em; }
    html.hud .filter-tab.active { background: rgba(255, 122, 47, 0.14); border-color: rgba(255, 122, 47, 0.6); color: var(--orange); }
    html.hud .log-item {
      border-radius: var(--r-row); background: var(--row); border: 1px solid var(--edge); border-left-width: 1px;
      box-shadow: var(--shine); margin-bottom: 8px;
    }
    html.hud .log-item.type-event { box-shadow: inset 3px 0 0 #c9d4de, var(--shine); }
    html.hud .log-item.type-action { box-shadow: inset 3px 0 0 var(--color-green), var(--shine); }
    html.hud .log-item.type-handoff { box-shadow: inset 3px 0 0 var(--orange), var(--shine); }
    html.hud .log-item.type-blocked { background: rgba(255, 74, 61, 0.16); border-color: rgba(255, 90, 75, 0.55); box-shadow: inset 3px 0 0 var(--color-red); }
    html.hud .log-badge { border-radius: 6px; font-family: var(--font-sans); letter-spacing: 0.06em; }
    html.hud .log-badge.badge-event { color: #e6edf3; background: rgba(255, 255, 255, 0.08); }
    html.hud .log-badge.badge-action { color: var(--color-green); background: rgba(125, 220, 111, 0.12); }
    html.hud .log-badge.badge-handoff { color: var(--orange); background: rgba(255, 122, 47, 0.12); }
    html.hud .agent-pill { border-radius: 6px; font-family: var(--font-sans); }
    html.hud .log-detail-line { font-family: var(--font-sans); color: var(--color-text-main); }
    html.hud .log-time { font-family: var(--font-mono); color: var(--color-text-dark); }

    /* Bottom bar: telemetry rows + big tile buttons ("VIEW FEED", "TAKE CONTROL") */
    html.hud .telem-label { font-family: var(--font-sans); font-size: 11px; font-weight: 600; letter-spacing: 0.08em; color: var(--color-text-dim); }
    html.hud .telem-val { font-family: var(--font-sans); font-weight: 600; color: #fff; }
    html.hud .telem-val .accent-cyan,
    html.hud .telem-val .accent-green { color: #fff; }
    html.hud .mem-bar-wrapper { border-radius: 3px; background: rgba(255, 255, 255, 0.1); border: 0; height: 4px; overflow: hidden; }
    html.hud .mem-bar-fill { border-radius: 3px; background: var(--orange); box-shadow: 0 0 12px rgba(255, 122, 47, 0.7); }
    html.hud .btn-tactical {
      border-radius: 14px; background: rgba(255, 255, 255, 0.06); border: 1px solid var(--edge); box-shadow: var(--shine);
      color: #fff; font-family: var(--font-sans); font-weight: 700; letter-spacing: 0.06em; text-shadow: none;
    }
    html.hud .btn-tactical:hover { background: rgba(255, 122, 47, 0.16); border-color: rgba(255, 122, 47, 0.7); color: #fff; box-shadow: 0 0 24px rgba(255, 122, 47, 0.25); }
    html.hud .btn-tactical.danger { background: rgba(255, 74, 61, 0.12); border-color: rgba(255, 90, 75, 0.45); }
    html.hud .btn-tactical.danger:hover { background: rgba(255, 74, 61, 0.28); border-color: rgba(255, 110, 95, 0.9); box-shadow: 0 0 26px rgba(255, 74, 61, 0.35); }
    html.hud .btn-tactical.toggle.paused { background: rgba(255, 122, 47, 0.2); border-color: var(--orange); color: var(--orange); }

    /* Blocked alert: a red graphite card with an orange-red HUD edge */
    html.hud #blocked-banner-container {
      border-radius: var(--r-panel);
      background: linear-gradient(160deg, rgba(120, 22, 18, 0.88), rgba(40, 10, 10, 0.9));
      border: 1px solid rgba(255, 90, 75, 0.75);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.12), 0 0 0 1px rgba(255, 74, 61, 0.25), 0 30px 90px rgba(255, 40, 30, 0.4);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
    }
    html.hud .banner-title { font-family: var(--font-sans); font-weight: 800; letter-spacing: 0.08em; }
    html.hud .banner-detail { font-family: var(--font-sans); }
    html.hud .banner-host { font-family: var(--font-mono); border-radius: 6px; }
    html.hud .banner-icon { border-radius: 14px; background: rgba(255, 74, 61, 0.25); border: 1px solid rgba(255, 110, 95, 0.6); }
    html.hud .banner-progress-fill { background: var(--color-red); }

    /* ---------------- High-contrast mode (html.hud.hc) for projectors ----------------
       Brighter labels, thicker brighter edges, larger text, stronger wires. */
    html.hud.hc {
      --color-text-main: #ffffff;
      --color-text-dim: rgba(255, 255, 255, 0.85);
      --color-text-dark: rgba(255, 255, 255, 0.7);
      --panel: rgba(30, 32, 36, 0.92);
      --row: rgba(255, 255, 255, 0.09);
      --edge: rgba(255, 255, 255, 0.32);
      --orange: #ff8a3d;
      --color-green: #8dff7a;
      --color-red: #ff5b4d;
    }
    html.hud.hc body { font-size: 16px; }
    html.hud.hc body::before { opacity: 0.6; }
    html.hud.hc #header-bar,
    html.hud.hc .stat-card,
    html.hud.hc #graph-panel,
    html.hud.hc #sidebar-panel,
    html.hud.hc #bottom-bar { border-width: 2px; backdrop-filter: none; -webkit-backdrop-filter: none; }
    html.hud.hc .brand-title { font-size: 1.15em; }
    html.hud.hc .stat-label,
    html.hud.hc .telem-label,
    html.hud.hc .sidebar-title { font-size: 13px; color: var(--color-text-dim); }
    html.hud.hc .stat-value { font-size: 42px; font-weight: 700; }
    html.hud.hc .stat-footer { font-size: 12px; }
    html.hud.hc .telem-val { font-size: 22px; font-weight: 700; }
    html.hud.hc .log-detail-line { font-size: 15px; line-height: 1.45; color: #fff; }
    html.hud.hc .log-time,
    html.hud.hc .log-extra-line { color: rgba(255, 255, 255, 0.75); }
    html.hud.hc .log-item { border-width: 1.5px; }
    html.hud.hc .log-badge,
    html.hud.hc .agent-pill { font-size: 12px; font-weight: 700; }
    html.hud.hc .filter-tab { font-size: 13px; color: #fff; }
    html.hud.hc .btn-tactical { font-size: 15px; border-width: 2px; }
    html.hud.hc .wire-path { stroke: rgba(255, 255, 255, 0.35); stroke-width: 2; }
    html.hud.hc .wire-handoff { stroke: rgba(255, 138, 61, 0.55); stroke-width: 2.5; }
    html.hud.hc .node-bg { fill: rgba(40, 42, 46, 0.97); stroke: rgba(255, 255, 255, 0.4); stroke-width: 2; }
    html.hud.hc .node-title { font-size: 14px; }
    html.hud.hc .node-subtitle,
    html.hud.hc .node-badge-text { fill: rgba(255, 255, 255, 0.85); font-size: 11px; }
    html.hud.hc #nodes-layer text[font-family="ui-monospace"] { fill: #ffffff; font-size: 12px; }
    html.hud.hc .pulse-particle { stroke: #000; stroke-width: 1; }
    html.hud.hc .banner-title { font-size: 1.25em; }
    html.hud.hc .banner-detail { font-size: 1.05em; color: #fff; }
  </style>
  <!-- THEME:HUD END -->
